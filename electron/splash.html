<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f6f8fa;
    user-select: none;
    -webkit-app-region: drag;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 32px;
  }
  .icon {
    font-size: 44px;
    margin-bottom: 14px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    color: #1a2332;
    margin-bottom: 20px;
    letter-spacing: -0.3px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #dde3ea;
    border-top-color: #007cba;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .text {
    font-size: 13px;
    color: #555;
    text-align: center;
  }
  .version {
    position: absolute;
    bottom: 12px;
    right: 16px;
    font-size: 10px;
    color: #aaa;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">📄</div>
    <div class="title">Documentation AI Tool</div>
    <div class="spinner"></div>
    <p class="text">Preparing intelligent authoring workspace...</p>
  </div>
  <div class="version">v1.0.0</div>
</body>
</html>
